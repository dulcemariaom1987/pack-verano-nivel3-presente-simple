<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pack verano jugando en inglés · Nivel 3 · Presente simple</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
:root{--ink:#23224a;--pink:#ff4fa3;--cyan:#27e1ff;--yellow:#ffd23f;--green:#2ee6a6;--orange:#ff8a3d;--purple:#8a5cff;--bad:#ff5a6e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Fredoka','Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;font-size:18px;color:var(--ink);
background:linear-gradient(160deg,#1b1464,#0c4a8a 60%,#0a8f9c) fixed;color-scheme:dark;overflow-x:hidden}
header{text-align:center;padding:18px 12px 6px;position:relative}
h1{margin:0;font-size:clamp(2.1rem,8vw,5rem);line-height:1.05;letter-spacing:1px;text-transform:uppercase;font-weight:700}
h1 span{display:block}
.l1,.l2,.sub{width:fit-content;margin-inline:auto;background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite alternate;filter:drop-shadow(0 0 4px var(--n)) drop-shadow(0 0 14px var(--n))}
.l1{--n:#ff2e93;background-image:linear-gradient(90deg,#ff2e93,#ff8a3d,#ffd23f,#ff8a3d,#ff2e93)}
.l2{--n:#27e1ff;background-image:linear-gradient(90deg,#27e1ff,#2ee6a6,#c3ff4d,#8a5cff,#27e1ff)}
.sub{--n:#ffd23f;background-image:linear-gradient(90deg,#ffd23f,#ff8a3d,#ff4fa3,#c27bff,#ffd23f);margin:10px auto 0;font-size:clamp(1.1rem,4vw,2rem);font-weight:700;text-transform:uppercase;letter-spacing:3px}
.badge{position:absolute;right:12px;top:12px;background:#ffffff26;color:#fff;border-radius:999px;padding:4px 14px;font-weight:700}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 8px;margin-top:10px;background:#0b0b3dd9;backdrop-filter:blur(8px);scrollbar-width:thin}
nav button{flex:0 0 auto;min-width:84px;font:inherit;font-size:.78rem;font-weight:600;color:#fff;background:#ffffff1f;border:2px solid transparent;border-radius:16px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s}
nav button i{font-style:normal;font-size:1.5rem}
nav button:hover{transform:translateY(-3px)}
nav button.on{background:linear-gradient(135deg,var(--pink),var(--orange));border-color:#fff;box-shadow:0 0 14px var(--pink)}
main{padding:8px 12px 40px}
.sec{animation:fade .5s}
.card{background:#fff;border-radius:26px;padding:clamp(14px,3vw,28px);box-shadow:0 10px 30px #0006;max-width:920px;margin:12px auto}
.card h2{margin:0 0 8px;font-size:clamp(1.4rem,5vw,2rem)}
.card p{line-height:1.45}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:.65em 1.3em;margin:4px;color:#fff;background:linear-gradient(135deg,var(--pink),var(--orange));box-shadow:0 5px 0 #0003;cursor:pointer;transition:transform .15s}
.btn.alt{background:linear-gradient(135deg,var(--purple),#27a9ff)}
.btn.ghost{background:#8a8aa8}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:10px}
.fb{min-height:1.6em;font-weight:600;text-align:center}
.prog{font-weight:700;color:var(--purple)}
.q{font-size:clamp(1.3rem,5vw,2rem);font-weight:700;margin:6px 0 12px}
.opt{display:block;width:100%;font:inherit;text-align:left;margin:8px 0;padding:12px 16px;border:3px solid #dcdcf0;border-radius:16px;background:#f8f8ff;color:var(--ink);cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--cyan)}
.opt.sel{border-color:var(--purple);background:#efe9ff}
.opt.good{border-color:var(--green);background:#d9fff1}
.opt.shake{animation:shake .4s}
.card h3{margin:18px 0 6px}
.rule{background:#f6f4ff;border-radius:18px;padding:10px 14px;margin:10px 0;border-left:10px solid var(--c)}
.rule p{margin:4px 0}
.chip.ex{font:inherit;font-weight:600;border:0;cursor:pointer;color:var(--ink)}
.chip.ex:hover{background:#ffe3f1}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.chip{background:#eef3ff;border-radius:999px;padding:6px 14px;font-weight:600}
.chip b{color:var(--pink)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.vcard{background:linear-gradient(160deg,#f3f0ff,#e6fbff);border-radius:20px;padding:14px;text-align:center;border:3px solid #fff;box-shadow:0 4px 14px #0002;transition:transform .2s}
.vcard:hover{transform:translateY(-5px) rotate(-1deg)}
.vcard .ic{font-size:3rem;animation:float 3s ease-in-out infinite}
.vcard .en{font-size:1.7rem;font-weight:700;color:var(--purple)}
.vcard small{display:block;color:#5a5a85}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.tile{font:inherit;font-weight:700;font-size:1.6rem;width:48px;height:56px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;box-shadow:0 4px 0 #0003;cursor:pointer;text-transform:uppercase}
.tile.empty{background:#e3e3f3;box-shadow:inset 0 2px 5px #0003;cursor:default}
.tile:disabled{opacity:.3}
.big .tile{background:none;color:var(--ink);box-shadow:none;border-bottom:4px solid var(--purple);cursor:default;border-radius:0;width:38px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.match .col{display:flex;flex-direction:column;gap:10px}
.m{font:inherit;font-weight:600;padding:12px;border:3px solid #dcdcf0;border-radius:14px;background:#f8f8ff;color:var(--ink);cursor:pointer}
.m.lock{border-color:var(--green)!important;background:#d9fff1!important;cursor:default}
.m.pick{outline:4px solid var(--yellow)}
.ws{display:grid;gap:4px;max-width:440px;margin:12px auto;touch-action:manipulation}
.ws button{aspect-ratio:1;font:inherit;font-weight:700;font-size:clamp(.9rem,4vw,1.3rem);padding:0;border:0;border-radius:8px;background:#eef3ff;color:var(--ink);cursor:pointer}
.ws button.sel{background:var(--yellow)}
.ws button.found{background:var(--green);color:#fff}
.memg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px;margin:12px auto}
.mem{perspective:600px;aspect-ratio:1/1.1;border:0;background:none;padding:0;cursor:pointer;font:inherit}
.inner{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mem.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;backface-visibility:hidden;font-weight:700;font-size:clamp(.85rem,3.6vw,1.3rem);padding:4px;color:#fff;box-shadow:0 4px 10px #0003}
.front{background:linear-gradient(135deg,var(--pink),var(--orange));font-size:2rem}
.back{background:linear-gradient(135deg,var(--cyan),var(--purple));transform:rotateY(180deg)}
.mem.done .back{background:linear-gradient(135deg,var(--green),#27a9ff)}
.popwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
.pop{--m:0;width:min(340px,88vw);height:auto;overflow:hidden;border-radius:26px;box-shadow:0 8px 22px #0004}
.pop .hot{opacity:calc(var(--m)*.85)}
.pop .sun,.pop .rays{transform-origin:245px 62px}
.pop .sun{transform:scale(calc(1 + var(--m)*.55));transition:transform .9s}
.pop .rays{animation:spin 12s linear infinite}
.pop .cloud{opacity:calc(1 - var(--m));animation:drift 9s ease-in-out infinite alternate}
.pop .heat{opacity:calc(var(--m)*1.2);animation:wave 1.1s ease-in-out infinite alternate}
.pop .bob{animation:float 3s ease-in-out infinite}
.pop .body{transform-origin:100px 200px;transform:scale(calc(1 + var(--m)*.25),calc(1 - var(--m)*.8));transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
.pop .puddle{transform-origin:100px 266px;transform:scale(calc(1 + var(--m)*2.2),calc(1 + var(--m)*.6));transition:transform .9s}
.pop .drops{opacity:calc(var(--m)*3)}
.pop .dr{fill:#ff7eb6;animation:drip 1.2s infinite ease-in}
.pop .d2{animation-delay:.3s}.pop .d3{animation-delay:.6s}.pop .d4{animation-delay:.9s}.pop .d5{animation-delay:.15s}
.pop .shine{animation:glint 3.5s ease-in-out infinite}
.pop .eyes{transform-origin:100px 100px;animation:blink 4s infinite}
.pop .brow{transform-box:fill-box;transform-origin:center}
.pop .bl{transform:rotate(calc(var(--m)*-28deg))}.pop .br{transform:rotate(calc(var(--m)*28deg))}
.pop .sweat{opacity:calc(var(--m)*2 - .5);animation:sweat 1.5s infinite}
.pop .frost{opacity:calc(1 - var(--m)*1.5)}
.pop .frost circle,.pop .stars path{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}
.pop .shades{opacity:0;transform:translateY(-26px);transition:.5s .2s}
.pop.win .shades{opacity:1;transform:none}
.pop .rainbow path{stroke-dasharray:400;stroke-dashoffset:400;transition:stroke-dashoffset 1.3s ease-out}
.pop.win .rainbow path{stroke-dashoffset:0}
.pop .stars{opacity:0;transition:opacity .4s}.pop.win .stars{opacity:1}
.pop.win .bob{animation:jump .7s ease-in-out 4}
.pop.lose .bob{animation:none}
.pop .sp{animation:splash .8s ease-out forwards}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-width:420px;margin:auto}
.key{font:inherit;font-weight:700;padding:8px 0;border:0;border-radius:10px;background:var(--yellow);color:var(--ink);box-shadow:0 3px 0 #0003;cursor:pointer}
.key:disabled{opacity:.3}
.cf{position:fixed;top:-40px;z-index:20;pointer-events:none;animation:cf linear forwards}
.bg{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.bg span{position:absolute;bottom:-60px;opacity:.35;animation:rise linear infinite}
@keyframes shine{to{background-position:100% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{transform:translateX(34px)}}
@keyframes wave{to{transform:translateY(-8px)}}
@keyframes glint{0%{transform:translateX(-140px)}60%,100%{transform:translateX(170px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes sweat{to{transform:translateY(18px)}}
@keyframes twinkle{50%{opacity:.25;transform:scale(1.7)}}
@keyframes jump{50%{transform:translateY(-28px)}}
@keyframes splash{to{transform:translate(var(--dx),calc(var(--dy) + 24px));opacity:0}}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.7}}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes pop{50%{transform:scale(1.12) rotate(4deg)}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(62px);opacity:0}}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg)}}
@media(max-width:520px){body{font-size:16px}.badge{position:static;display:inline-block;margin-top:8px}.match{gap:8px}.tile{width:42px;height:50px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<header>
  <h1 class="neon"><span class="l1">Pack verano</span><span class="l2">jugando en inglés</span></h1>
  <p class="sub neon">Nivel 3 · Presente simple</p>
  <div class="badge">⭐ <b id="stars">0</b></div>
</header>
<nav id="menu" aria-label="Secciones de la clase"></nav>
<main id="main"></main>

<script>
'use strict';

/* ---------- Utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = rnd(i + 1); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const h = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k === 'class' ? 'class' : k, v);
  }
  e.append(...kids);
  return e;
};
const card = (title, ...kids) => h('div', { class: 'card' }, h('h2', { text: title }),
  ...kids.map(k => typeof k === 'string' ? h('p', { text: k }) : k));

/* ---------- Services: sound effects, voice, score, confetti ---------- */
const Sfx = {
  ctx: null,
  tone(freq, at = 0, dur = .15, type = 'sine') {
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx; if (c.state === 'suspended') c.resume();
      const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
      o.type = type; o.frequency.value = freq; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.start(t); o.stop(t + dur);
    } catch (e) { /* sound not available */ }
  },
  play(name) {
    const seq = {
      click: [[660, 0, .08]], flip: [[440, 0, .06, 'triangle']], bad: [[220, 0, .12, 'sawtooth'], [170, .12, .2, 'sawtooth']],
      ok: [[523, 0, .12], [659, .1, .12], [784, .2, .2]], drip: [[900, 0, .08], [600, .08, .1]],
      win: [[523, 0, .15], [659, .15, .15], [784, .3, .15], [1047, .45, .45]]
    }[name] || [];
    seq.forEach(a => this.tone(...a));
  }
};
const Voice = {
  stop() { if ('speechSynthesis' in window) speechSynthesis.cancel(); },
  speak(segments) {
    if (!('speechSynthesis' in window)) return;
    this.stop();
    [].concat(segments).forEach(seg => {
      const { t, l = 'en-US' } = typeof seg === 'string' ? { t: seg } : seg;
      const u = new SpeechSynthesisUtterance(t);
      u.lang = l; u.rate = l === 'en-US' ? .85 : .95;
      const v = speechSynthesis.getVoices().find(x => x.lang.replace('_', '-') === l);
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    });
  }
};
const ES = t => ({ t, l: 'es-ES' });
const State = { stars: 0, add(n) { this.stars += n; $('#stars').textContent = this.stars; } };
function confetti(n = 36) {
  const em = ['🎉', '⭐', '🍦', '🌟', '🎈', '☀️'];
  for (let i = 0; i < n; i++) {
    const s = h('span', { class: 'cf', text: em[i % em.length] });
    s.style.cssText = `left:${Math.random() * 100}vw;animation-duration:${2 + Math.random() * 2}s;animation-delay:${Math.random() * .6}s;font-size:${18 + Math.random() * 20}px`;
    document.body.append(s); setTimeout(() => s.remove(), 5200);
  }
}
function finishSection(body, msg) {
  Sfx.play('win'); confetti();
  body.replaceChildren(h('h2', { text: '🎉 ' + msg }), h('p', { text: '¡Muy bien! Sigue con la próxima sección.' }),
    h('div', { class: 'row' }, h('button', { class: 'btn', text: 'Siguiente sección ➜', onclick: () => Nav.next() })));
}

/* ---------- Content ---------- */
const WORDS = [
  { en: 'play', es: 'jugar', ic: '⚽', s3: 'plays', ex: 'I play soccer.', exEs: 'Yo juego fútbol.' },
  { en: 'swim', es: 'nadar', ic: '🏊', s3: 'swims', ex: 'She swims in the sea.', exEs: 'Ella nada en el mar.' },
  { en: 'read', es: 'leer', ic: '📖', s3: 'reads', ex: 'He reads a book.', exEs: 'Él lee un libro.' },
  { en: 'study', es: 'estudiar', ic: '✏️', s3: 'studies', ex: 'We study English.', exEs: 'Nosotros estudiamos inglés.' },
  { en: 'sleep', es: 'dormir', ic: '😴', s3: 'sleeps', ex: 'The cat sleeps a lot.', exEs: 'El gato duerme mucho.' },
  { en: 'drink', es: 'beber', ic: '🥤', s3: 'drinks', ex: 'They drink juice.', exEs: 'Ellos beben jugo.' },
  { en: 'watch', es: 'mirar', ic: '📺', s3: 'watches', ex: 'I watch TV.', exEs: 'Yo miro la tele.' },
  { en: 'cook', es: 'cocinar', ic: '🍳', s3: 'cooks', ex: 'My mom cooks pizza.', exEs: 'Mi mamá cocina pizza.' }
];
const QUIZ = [
  { q: 'She ____ soccer every day.', opts: ['play', 'plays', 'playing'], a: 1 },
  { q: 'I ____ English at school.', opts: ['study', 'studies', 'studys'], a: 0 },
  { q: 'He ____ a book.', opts: ['read', 'reading', 'reads'], a: 2 },
  { q: 'They ____ juice.', opts: ['drinks', 'drink', 'drinking'], a: 1 },
  { q: 'My dog ____ a lot.', opts: ['sleep', 'sleeps', 'sleeping'], a: 1 }
];
const TRUEFALSE = [
  { q: 'Con he, she e it, el verbo lleva una -s: «He plays».', opts: ['Verdadero', 'Falso'], a: 0 },
  { q: 'Con I, el verbo lleva -s: «I plays».', opts: ['Verdadero', 'Falso'], a: 1 },
  { q: '«They swim in the pool» está bien escrita.', opts: ['Verdadero', 'Falso'], a: 0 },
  { q: '«We watches TV» está bien escrita.', opts: ['Verdadero', 'Falso'], a: 1 },
  { q: '«Cook» significa «nadar».', opts: ['Verdadero', 'Falso'], a: 1 }
];
const LISTEN = [
  { say: 'I swim in the sea.', opts: ['Yo nado en el mar.', 'Yo duermo en el mar.', 'Yo cocino en el mar.'], a: 0 },
  { say: 'He plays soccer.', opts: ['Él mira fútbol.', 'Él juega fútbol.', 'Él lee fútbol.'], a: 1 },
  { say: 'We study English.', opts: ['Nosotros estudiamos inglés.', 'Nosotros bebemos inglés.', 'Nosotros cocinamos inglés.'], a: 0 },
  { say: 'She drinks juice.', opts: ['Ella cocina jugo.', 'Ella bebe jugo.', 'Ella lee jugo.'], a: 1 },
  { say: 'They watch TV.', opts: ['Ellos miran la tele.', 'Ellos nadan en la tele.', 'Ellos juegan tele.'], a: 0 }
];

/* ---------- Sections (each one: {id, icon, label, mount(el)}) ---------- */
const RULES = [
  { c: '#ff4fa3', t: '1️⃣ Regla general: agrega «s»', note: 'La mayoría de los verbos solo recibe una «s» al final.', ex: ['play → plays', 'read → reads', 'cook → cooks', 'swim → swims'] },
  { c: '#27c7e8', t: '2️⃣ Si termina en o, ch, sh, s, x o z: agrega «es»', note: 'Son sonidos fuertes: con «es» se pueden pronunciar bien. Truco para recordar: o · ch · sh · s · x · z.', ex: ['go → goes', 'do → does', 'watch → watches', 'wash → washes', 'kiss → kisses', 'fix → fixes', 'buzz → buzzes'] },
  { c: '#8a5cff', t: '3️⃣ Consonante + y: cambia la «y» por «ies»', note: 'Mira la letra que está antes de la «y». Si es una consonante (b, c, d, f, g, l, m, n, p, r, s, t...), quita la «y» y escribe «ies».', ex: ['study → studies', 'cry → cries', 'fly → flies', 'try → tries'] },
  { c: '#1ec98f', t: '4️⃣ Vocal + y: solo agrega «s»', note: 'Si antes de la «y» hay una vocal (a, e, i, o, u), la «y» no cambia.', ex: ['play → plays', 'enjoy → enjoys', 'say → says', 'buy → buys'] },
  { c: '#ff8a3d', t: '⭐ Verbo especial: have', note: '«Have» no sigue las reglas: cambia por completo.', ex: ['have → has'] }
];
const ruleCard = r => {
  const box = h('div', { class: 'rule' }, h('b', { text: r.t }), h('p', { text: r.note }),
    h('div', { class: 'chips' }, ...r.ex.map(x => h('button', { class: 'chip ex', text: '🔊 ' + x, onclick: () => { Sfx.play('click'); Voice.speak('he ' + x.split('→')[1].trim()); } }))));
  box.style.setProperty('--c', r.c); return box;
};

const introSection = () => ({
  id: 'inicio', icon: '🏖️', label: 'Inicio',
  mount(el) {
    const speech = [
      ES('¡Hola! Hoy aprenderás el presente simple. Sirve para hablar de lo que haces siempre o todos los días.'),
      'I play. You play. We play. They play.',
      ES('Con he, she e it, el verbo lleva una ese al final.'),
      'He plays. She plays. It plays.',
      ES('Ahora las reglas para he, she e it. Regla uno: la mayoría de los verbos solo agrega una ese.'), 'He plays. She reads.',
      ES('Regla dos: si el verbo termina en o, ch, sh, s, x o z, se agrega e ese.'), 'He goes. She watches. He washes. It fixes.',
      ES('Regla tres: si termina en consonante más i griega, la i griega cambia por i e ese.'), 'He studies. She cries.',
      ES('Regla cuatro: si termina en vocal más i griega, solo se agrega ese.'), 'He plays. She enjoys.',
      ES('El verbo have es especial.'), 'She has a dog.',
      ES('Son once secciones y dura unos treinta minutos. ¡Vamos a jugar!')
    ];
    el.append(card('¡Bienvenido al verano! ☀️',
      'Hoy aprenderás el PRESENTE SIMPLE: lo usamos para hablar de lo que haces siempre o todos los días.',

function buildGrid(words, n) {
  const g = Array.from({ length: n }, () => Array(n).fill(''));
  for (const w of [...words].sort((a, b) => b.length - a.length)) {
    let placed = false;
    for (let t = 0; t < 400 && !placed; t++) {
      const vertical = Math.random() < .5;
      const r = rnd(vertical ? n - w.length + 1 : n), c = rnd(vertical ? n : n - w.length + 1);
      const cells = [...w].map((_, k) => [r + (vertical ? k : 0), c + (vertical ? 0 : k)]);
      if (cells.every(([y, x]) => !g[y][x])) { cells.forEach(([y, x], k) => g[y][x] = w[k]); placed = true; }
    }
    if (!placed) return buildGrid(words, n);
  }
  return g.map(row => row.map(ch => ch || String.fromCharCode(65 + rnd(26))));
}
const straightLine = (a, b) => {
  if (a[0] !== b[0] && a[1] !== b[1]) return null;
  const dr = Math.sign(b[0] - a[0]), dc = Math.sign(b[1] - a[1]), len = Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])) + 1;
  return Array.from({ length: len }, (_, k) => [a[0] + dr * k, a[1] + dc * k]);
};

    const stage = h('div'); stage.innerHTML = POP_SVG;
    const svg = stage.firstElementChild, mouth = svg.querySelector('.mouth'), splashLayer = svg.querySelector('.splash');
    const wordEl = h('div', { class: 'slots big' }), info = h('p', { class: 'fb' }), kb = h('div', { class: 'kb' }), actions = h('div', { class: 'row' });
    const splash = () => {
      for (let k = 0; k < 9; k++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('class', 'sp'); c.setAttribute('cx', 150 + rnd(50) - 25); c.setAttribute('cy', 294);
        c.setAttribute('r', 2 + rnd(3)); c.setAttribute('fill', '#ff7eb6');
        c.style.setProperty('--dx', (rnd(70) - 35) + 'px'); c.style.setProperty('--dy', -(25 + rnd(45)) + 'px');
        splashLayer.append(c); setTimeout(() => c.remove(), 900);
      }
    };
    const jolt = () => svg.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-7px) rotate(-1deg)' }, { transform: 'translateX(7px) rotate(1deg)' }, { transform: 'none' }], { duration: 350 });
    const paint = () => {
      const { w, hint } = rounds[r];
      wordEl.replaceChildren(...[...w].map(L => h('span', { class: 'tile', text: guessed.has(L) ? L : '' })));
      svg.style.setProperty('--m', errors / MAX);
      mouth.setAttribute('d', MOUTHS[errors < 2 ? 0 : errors < 4 ? 1 : 2]);
      info.textContent = `Pista: «${hint}» · Vidas: ${'❤️'.repeat(MAX - errors)}${'🤍'.repeat(errors)}`;
    };
    const end = () => { over = true; kb.querySelectorAll('button').forEach(b => b.disabled = true); };
    const guess = (L, b) => {
      if (over) return;
      b.disabled = true; guessed.add(L);
      const { w } = rounds[r];
      if (w.includes(L)) Sfx.play('ok'); else { errors++; Sfx.play('drip'); setTimeout(() => Sfx.play('bad'), 150); splash(); jolt(); }
      paint();
      if ([...w].every(x => guessed.has(x))) {
        end(); svg.classList.add('win'); Sfx.play('win'); confetti(50); Voice.speak(w.toLowerCase()); State.add(2);
        const last = r + 1 >= rounds.length;
        actions.replaceChildren(h('button', { class: 'btn', text: last ? 'Continuar ➜' : 'Siguiente paleta 🍦', onclick: () => { if (last) Nav.next(); else { r++; start(); } } }));
        info.textContent = `¡Salvaste la paleta! 😎🌈 La palabra era «${w.toLowerCase()}».`;
      } else if (errors >= MAX) {
        end(); svg.classList.add('lose'); splash(); setTimeout(splash, 300);
        info.textContent = '¡La paleta se derritió! 😢 Pero puedes intentarlo otra vez.';
        actions.replaceChildren(h('button', { class: 'btn alt', text: 'Reintentar 🔄', onclick: start }));
      }
    };
    const start = () => {
      guessed = new Set(); errors = 0; over = false; actions.replaceChildren(); svg.classList.remove('win', 'lose');
      kb.replaceChildren(...[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(L => h('button', { class: 'key', text: L, onclick: e => guess(L, e.currentTarget) })));
      paint();
    };
    el.append(card('🍦 Salva la paleta', 'Adivina la palabra en inglés letra por letra. Cada error calienta el sol y derrite la paleta. ¡Tienes 6 vidas! Si la salvas, ¡aparecerá un arcoíris!',
      h('div', { class: 'popwrap' }, stage, h('div', {}, wordEl, info)), kb, actions));
    start();
  }
});

const finalSection = () => ({
  id: 'final', icon: '🏆', label: 'Final',
  mount(el) {
    const s = State.stars;
    el.append(card('🏆 ¡Lo lograste!',
      h('div', { class: 'q', text: `Conseguiste ⭐ ${s} estrellas` }),
      s >= 30 ? '¡Increíble! Eres un campeón del presente simple. 🌟' : s >= 15 ? '¡Muy bien! Ya dominas casi todo. Repite las secciones que quieras. 💪' : '¡Buen comienzo! Repite las secciones para ganar más estrellas. 😊',
      'Recuerda: con I, you, we y they el verbo no cambia; con he, she e it lleva «s» (o «es» como en watches y «ies» como en studies).',
      h('div', { class: 'row' }, h('button', { class: 'btn', text: '🔁 Volver al inicio', onclick: () => Nav.go('inicio') }))));
    Sfx.play('win'); confetti(60); Voice.speak([ES('¡Felicidades! Terminaste la clase. ¡Hasta pronto!'), 'See you soon!']);
  }
});

/* ---------- Navigation ---------- */
const Nav = {
  sections: [], current: -1,
  init(sections) {
    this.sections = sections;
    $('#menu').append(...sections.map(s => h('button', { id: 'nav-' + s.id, onclick: () => { Sfx.play('click'); this.go(s.id); } }, h('i', { text: s.icon }), s.label)));
    this.go(sections[0].id);
  },
  go(id) {
    Voice.stop();
    this.current = this.sections.findIndex(s => s.id === id);
    const sec = h('section', { class: 'sec' });
    $('#main').replaceChildren(sec);
    this.sections[this.current].mount(sec);
    this.sections.forEach((s, k) => $('#nav-' + s.id).classList.toggle('on', k === this.current));
    $('#nav-' + id).scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  next() { this.go(this.sections[Math.min(this.current + 1, this.sections.length - 1)].id); }
};

/* ---------- Decorative background ---------- */
$('#bg').append(...['☀️', '🍦', '🌴', '🏖️', '🩴', '🍉', '🐚', '🌊'].map((e, k) => {
  const s = h('span', { text: e });
  s.style.cssText = `left:${6 + k * 12}%;font-size:${28 + (k % 3) * 14}px;animation-duration:${14 + k * 2}s;animation-delay:${-k * 3}s`;
  return s;
}));

/* ---------- Start ---------- */
Nav.init([
  introSection(), vocabSection(),
  choiceSection({ id: 'quiz', icon: '🧠', label: 'Quiz', help: 'Elige la forma correcta del verbo para completar la oración y pulsa «Verificar».', items: QUIZ }),
  matchSection(), scrambleSection(), searchSection(), memorySection(), popsicleSection(),
  choiceSection({ id: 'listen', icon: '🎧', label: 'Escucha', help: 'Pulsa «Escuchar» (puedes repetirlo) y elige la traducción correcta en español.', items: LISTEN }),
  choiceSection({ id: 'tf', icon: '✅', label: 'Verdadero o falso', help: 'Lee cada frase y decide si es verdadera o falsa.', items: TRUEFALSE }),
  finalSection()
]);
if ('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
